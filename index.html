<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Lift Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Inter+Tight:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="tab-nav">
  <div class="tabs">
    <button class="tab active" data-tab="home" onclick="switchTab('home')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab" data-tab="myPlans" onclick="switchTab('myPlans')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
        <line x1="8" y1="16" x2="12" y2="16"/>
      </svg>
      <span class="tab-label">My Plans</span>
    </button>
    <button class="tab" data-tab="progress" onclick="switchTab('progress')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>
      </svg>
      <span class="tab-label">Progress</span>
    </button>
    <button class="tab" data-tab="profile" onclick="switchTab('profile')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="tab-label">Profile</span>
    </button>
  </div>
</div>

<div id="activeWorkoutBanner" class="active-workout-banner" onclick="resumeSession()">
  <div class="awb-left">
    <div class="awb-title" id="awbTitle"></div>
    <div class="awb-meta" id="awbMeta"></div>
  </div>
  <div class="awb-right">
    <span class="awb-elapsed" id="awbElapsed"></span>
    <button class="awb-resume-btn">Resume</button>
  </div>
</div>

<div id="homePage" class="page active"></div>
<div id="myPlansPage" class="page"></div>
<div id="sessionPage" class="page"></div>
<div id="progressPage" class="page"></div>
<div id="settingsPage" class="page"></div>

<div class="modal-bg" id="finishModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-icon">💪</div>
    <div class="modal-title">Finish Session?</div>
    <div class="modal-text" id="finishModalText">You haven't logged all sets yet. Save anyway?</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="confirmFinishSession()">Save Session</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="resetModal">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">Reset All Data?</div>
    <div class="modal-text">This will delete all your logged workouts and history. This cannot be undone.</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeResetModal()">Cancel</button>
      <button class="modal-btn primary" onclick="confirmReset()">Delete All</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="editModal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal" style="max-width: 440px; text-align: left; max-height: 88vh; overflow-y: auto;">
    <div class="modal-title" style="text-align: left;">Edit Workout</div>
    <div id="editModalBody"></div>
    <div class="modal-actions" style="margin-top: 20px;">
      <button class="modal-btn" onclick="closeEditModal()">Cancel</button>
      <button class="modal-btn" onclick="deleteEditSession()" style="background: rgba(255,107,53,0.15); border-color: rgba(255,107,53,0.4); color: var(--push);">Delete</button>
      <button class="modal-btn primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Calendar Day Modal — bottom sheet -->
<div class="modal-bg" id="calendarDayModal" onclick="closeCalendarDay()">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div id="calendarDayBody"></div>
  </div>
</div>

<!-- Session Full Edit Modal -->
<div class="modal-bg" id="sessionEditModal" onclick="if(event.target===this)closeSessionEdit()">
  <div class="modal" style="max-width:480px;text-align:left;max-height:90vh;overflow-y:auto;">
    <div id="sessionEditBody"></div>
    <div class="modal-actions" style="margin-top:20px;">
      <button class="modal-btn" onclick="closeSessionEdit()">Cancel</button>
      <button class="modal-btn primary" onclick="saveSessionEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <div class="modal-text" id="confirmModalText"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="confirmModalCancel">Cancel</button>
      <button class="modal-btn primary" id="confirmModalOk">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="promptModal">
  <div class="modal">
    <div class="modal-text" id="promptModalText"></div>
    <input type="text" class="bw-input" id="promptModalInput" style="width:100%;margin:12px 0 4px;">
    <div class="modal-actions">
      <button class="modal-btn" id="promptModalCancel">Cancel</button>
      <button class="modal-btn primary" id="promptModalOk">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Rest Timer Pill -->
<div id="restTimerPill" class="rest-timer-pill" onclick="window.toggleTimerExpanded()">
  <svg class="timer-ring-svg" viewBox="0 0 72 72" width="72" height="72">
    <circle class="timer-track-circle" cx="36" cy="36" r="28" fill="none" stroke-width="3"/>
    <circle id="timerProgressCircle" class="timer-progress-circle" cx="36" cy="36" r="28" fill="none"
            stroke-width="3" stroke-linecap="round" transform="rotate(-90 36 36)"/>
  </svg>
  <div class="timer-main">
    <span id="timerDisplay" class="timer-display-text">2:00</span>
  </div>
  <div id="timerControlsRow" class="timer-controls-row">
    <button id="timerPauseBtn" class="timer-ctrl" onclick="window.pauseTimer(); event.stopPropagation()">⏸</button>
    <button class="timer-ctrl" onclick="window.skipTimer(); event.stopPropagation()" title="Skip to ready">⏭</button>
    <button class="timer-ctrl" onclick="window.resetTimer(); event.stopPropagation()" title="Reset">↺</button>
  </div>
</div>

<div id="welcomeScreen" aria-hidden="true"></div>

<!-- Onboarding overlay — shown for brand new users -->
<div id="onboardingContainer" class="onboarding-container">
  <div id="onboardingBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
