<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Lift Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Inter+Tight:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="tab-nav">
  <div class="app-title">Lift <span>Tracker</span></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('plan')">Plan</button>
    <button class="tab" onclick="switchTab('progress')">Progress</button>
    <button class="tab" onclick="switchTab('settings')">Settings</button>
  </div>
</div>

<div id="activeWorkoutBanner" class="active-workout-banner" onclick="resumeSession()">
  <div class="awb-left">
    <div class="awb-title" id="awbTitle"></div>
    <div class="awb-meta" id="awbMeta"></div>
  </div>
  <div class="awb-right">
    <span class="awb-elapsed" id="awbElapsed"></span>
    <button class="awb-resume-btn">Resume</button>
  </div>
</div>

<div id="planPage" class="page active"></div>
<div id="sessionPage" class="page"></div>
<div id="progressPage" class="page"></div>
<div id="settingsPage" class="page"></div>

<div class="modal-bg" id="finishModal">
  <div class="modal">
    <div class="modal-icon">💪</div>
    <div class="modal-title">Finish Session?</div>
    <div class="modal-text" id="finishModalText">You haven't logged all sets yet. Save anyway?</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="confirmFinishSession()">Save Session</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="resetModal">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">Reset All Data?</div>
    <div class="modal-text">This will delete all your logged workouts and history. This cannot be undone.</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeResetModal()">Cancel</button>
      <button class="modal-btn primary" onclick="confirmReset()">Delete All</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal" style="max-width: 440px; text-align: left; max-height: 88vh; overflow-y: auto;">
    <div class="modal-title" style="text-align: left;">Edit Workout</div>
    <div id="editModalBody"></div>
    <div class="modal-actions" style="margin-top: 20px;">
      <button class="modal-btn" onclick="closeEditModal()">Cancel</button>
      <button class="modal-btn" onclick="deleteEditSession()" style="background: rgba(255,107,53,0.15); border-color: rgba(255,107,53,0.4); color: var(--push);">Delete</button>
      <button class="modal-btn primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Calendar Day Modal — bottom sheet -->
<div class="modal-bg" id="calendarDayModal" onclick="closeCalendarDay()">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div id="calendarDayBody"></div>
  </div>
</div>

<!-- Session Full Edit Modal -->
<div class="modal-bg" id="sessionEditModal">
  <div class="modal" style="max-width:480px;text-align:left;max-height:90vh;overflow-y:auto;">
    <div id="sessionEditBody"></div>
    <div class="modal-actions" style="margin-top:20px;">
      <button class="modal-btn" onclick="closeSessionEdit()">Cancel</button>
      <button class="modal-btn primary" onclick="saveSessionEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <div class="modal-text" id="confirmModalText"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="confirmModalCancel">Cancel</button>
      <button class="modal-btn primary" id="confirmModalOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Rest Timer Pill -->
<div id="restTimerPill" class="rest-timer-pill" onclick="window.toggleTimerExpanded()">
  <svg class="timer-ring-svg" viewBox="0 0 72 72" width="72" height="72">
    <circle class="timer-track-circle" cx="36" cy="36" r="28" fill="none" stroke-width="3"/>
    <circle id="timerProgressCircle" class="timer-progress-circle" cx="36" cy="36" r="28" fill="none"
            stroke-width="3" stroke-linecap="round" transform="rotate(-90 36 36)"/>
  </svg>
  <div class="timer-main">
    <span id="timerDisplay" class="timer-display-text">2:00</span>
  </div>
  <div id="timerControlsRow" class="timer-controls-row" onclick="event.stopPropagation()">
    <button id="timerPauseBtn" class="timer-ctrl" onclick="window.pauseTimer()">⏸</button>
    <button class="timer-ctrl" onclick="window.skipTimer()" title="Skip to ready">⏭</button>
    <button class="timer-ctrl" onclick="window.resetTimer()" title="Reset">↺</button>
  </div>
</div>

<div id="welcomeScreen" aria-hidden="true"></div>

<!-- Onboarding overlay — shown for brand new users -->
<div id="onboardingContainer" class="onboarding-container">
  <div id="onboardingBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
